name: Offline regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline regression suite
        run: python -B -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -B -m compileall -q .

      - name: Check Windows launcher encoding
        run: python -c "from pathlib import Path; Path('qidong.bat').read_bytes().decode('ascii')"

      - name: Check committed whitespace
        run: git diff --check HEAD^ HEAD

  browser:
    name: Browser fixture
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install browser test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser fixture tests
        run: python -B -m unittest tests.test_browser_fixture -v

      - name: Check committed whitespace
        run: git diff --check HEAD^ HEAD
